server:
  port: 9990
  servlet:
    context-path: /api

spring:
  application:
    name: pisces
  profiles:
    active: dev
  data:
    redis:
      host: localhost
      port: 6379
      password:  # Redis密码，如果没有密码则留空
      database: 0  # 使用的数据库索引
      timeout: 3000  # 连接超时时间（毫秒）
      lettuce:
        pool:
          max-active: 8  # 连接池最大连接数
          max-idle: 8  # 连接池最大空闲连接数
          min-idle: 0  # 连接池最小空闲连接数
          max-wait: -1  # 连接池最大阻塞等待时间（-1表示没有限制）

# Zookeeper配置
zookeeper:
  connectString: localhost:2181
  sessionTimeoutMs: 30000
  connectionTimeoutMs: 30000
  maxRetries: 3
  basePath: /pisces

# 阿里通义千问API配置
tongyi:
  apiKey: sk-51d72fee74474b9f89b1b234978b762d # 必须配置真实通义 API Key，否则 AI 流程直接失败
  model: qwen-plus  # 模型名称：qwen-turbo, qwen-plus, qwen-max等
  timeout: 30000  # 请求超时时间（毫秒）
  enabled: true  # 是否启用通义API；关闭后 AI 流程将直接失败

# Pisces 安全配置
pisces:
  security:
    # 有效的 API Key 列表（生产环境应通过环境变量注入，如 PISCES_API_KEY_1）
    # 请求时在 Header 中携带：X-Pisces-Api-Key: <key>
    api-keys:
      - ${PISCES_API_KEY_1:pisces-dev-key-001}
      - ${PISCES_API_KEY_2:pisces-dev-key-002}
    # 完全跳过鉴权的路径前缀（健康检查等）
    skip-paths:
      - /actuator/

logging:
  level:
    root: INFO
    com.pisces: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
