name: pisces-local

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${PISCES_LOCAL_MYSQL_DATABASE:-pisces}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${PISCES_LOCAL_MYSQL_PORT:-3306}:3306"
    volumes:
      - pisces-local-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${PISCES_LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - pisces-local-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  zookeeper:
    image: zookeeper:3.9
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,stat
      TZ: Asia/Shanghai
    ports:
      - "${PISCES_LOCAL_ZOOKEEPER_PORT:-2181}:2181"
    volumes:
      - pisces-local-zookeeper-data:/data
      - pisces-local-zookeeper-datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 2181 | grep imok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pisces-local-mysql:
  pisces-local-redis:
  pisces-local-zookeeper-data:
  pisces-local-zookeeper-datalog:
